# Weapon TYPE def (9.6). See gun_laser.def.toml header for units.
# Rockets ride the gun socket category too (PLAN Phase 9: "rockets =
# unguided but steerable-ish darts with a short boost" — mount model is
# the #21 socket gate, not a new category).
component_type = "gun.rocket"
category = "gun"
refs = ["../../samples/component_gizmos.glb"]

[attrs]
weapon.damage = 400000
weapon.range = 8000
weapon.rof = 0.2
weapon.spread = 0.002
weapon.heat_per_shot = 15000
weapon.heat_dissipate = 5000
