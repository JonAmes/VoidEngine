# Phase 5 sample hull def — companion to assets/samples/test_ship.glb (5.8,
# 5.9a). Hardpoints live in the .glb itself (#14); this file adds the sim
# layer: stats, grid + sections (#19a/#44), components (#18/#21), wiring
# (#26a), facets (#28a). #42: length fields are unit-suffixed strings; kg/N/W
# and dimensionless values are plain SI numbers.
#
# Lattice (#44/#46b): 2 m cells, 4 subcells (0.5 m x/z, 0.55 m y), 0.1 m snap
# tolerance. Y is up: cell row 0 spans y in [0, 2.2). The GLB's anchor nodes
# are lattice-exact on purpose — 5.9b cross-validates anchors against these
# sections and rewrites snapped coords into the cooked SOCK payload (an
# on-lattice fixture makes the rewrite a visible no-op; off-lattice snapping
# is covered by 5.9b unit gates). The prefixed component ids seat_pilot,
# door_1, panel_main, berth_1 pair 1:1 with the GLB interior empties of the
# same name (#46a).
#
# NOTE: bare key/values must precede ALL table headers (TOML law) — the
# parser inserts keys into the last-opened table, so root fields live here.
refs = ["../samples/test_ship.glb"]

class_tag = "class.light_freighter"
hull_mass = 98000
hull_com = ["0 m", "0.25 m", "0.4 m"]
hull_inertia_diag = [420000, 980000, 1120000]

[grid]
cell = "2 m"
subcell_ratio = 4
cell_height = "2.2 m"
tolerance = "0.1 m"

# Sections tile the hull without overlap (#19a). door_1's cell (0,0,0) sits
# in midship with engineering above it (+z) — a cross-section walk seam
# (#30a, validated at 5.9b).
[[section]]
name = "bridge"
cells = [[-1, 0, -2, 1, 1, -2]]

[[section]]
name = "midship"
cells = [[-3, 0, -1, 3, 1, 0]]

[[section]]
name = "engine_bay"
cells = [[-3, 0, -3, 3, 1, -3]]

[[section]]
name = "engineering"
cells = [[-1, 0, 1, 1, 1, 3]]

[[component]]
id = "engine_L"
type = "thruster.main"
category = "main"
socket = "hp_engine_L"
tags = ["propulsion"]
[component.attrs]
mass = 900
power.draw = 25000
thrust.force = 320000
thrust.isp = 300
thrust.gimbal_rad = "15 deg"   # #46e: degrees authored, radians cooked

[[component]]
id = "engine_R"
type = "thruster.main"
category = "main"
socket = "hp_engine_R"
tags = ["propulsion"]
[component.attrs]
mass = 900
power.draw = 25000
thrust.force = 320000
thrust.isp = 300
thrust.gimbal_rad = "15 deg"

[[component]]
id = "rcs_wt"
type = "thruster.rcs"
category = "rcs"
socket = "hp_wingtip_R"
[component.attrs]
mass = 40
power.draw = 800
thrust.force = 4000
thrust.isp = 220

[[component]]
id = "sensor_scan"
type = "sensor.array"
category = "utility"
socket = "hp_wingtip_L"
[component.attrs]
mass = 60
power.draw = 1500
sensor.range = "120 km"
sensor.res_arcmin = 2.5

[[component]]
id = "turret_dorsal"
type = "turret.dorsal"
category = "gun"
socket = "hp_dorsal_turret"
[component.attrs]
mass = 250
power.draw = 5000
[[component.facet]]
action = "operate.station"
range = "1.5 m"

[[component]]
id = "seat_pilot"
type = "seat.pilot"
category = "utility"
socket = "hp_seat_pilot"
tags = ["station.pilot"]

[[component.facet]]
action = "use.seat"
range = "1.2 m"

[[component]]
id = "door_1"
type = "door.hatch"
category = "utility"
socket = "door_1"

[[component.facet]]
action = "use.door"
range = "1.2 m"

[[component]]
id = "panel_main"
type = "panel.dash"
category = "utility"
socket = "panel_main"

[[component.facet]]
action = "use.panel"
range = "1.2 m"

[[component.facet]]
action = "repair.target"   # #28a: target names a real wire id (5.9b gate)
range = "1.2 m"
target = "w_engL"

[[component]]
id = "berth_1"
type = "berth.crew"
category = "utility"
socket = "berth_1"

[[component.facet]]
action = "use.berth"
range = "1.2 m"

[[component]]
id = "reactor_1"
type = "power.reactor"
category = "utility"
socket = "hp_reactor"
[component.attrs]
mass = 400
power.supply = 120000

[[component]]
id = "battery_1"
type = "power.battery"
category = "utility"
socket = "hp_battery"
[component.attrs]
mass = 120
power.supply = 50000

[[wire]]
id = "w_engL"
type = "power"
from = "component.reactor_1"
to = "socket.hp_engine_L"

[[wire]]
id = "w_engR"
type = "power"
from = "component.reactor_1"
to = "socket.hp_engine_R"

[[wire]]
id = "w_rcs"
type = "power"
from = "component.battery_1"
to = "socket.hp_wingtip_R"

[[wire]]
id = "w_sensor"
type = "power"
from = "component.battery_1"
to = "socket.hp_wingtip_L"

[[wire]]
id = "w_turret"
type = "power"
capacity = 6000
from = "component.reactor_1"
to = "socket.hp_dorsal_turret"

[[wire]]
id = "w_fire_ctrl"
type = "power+signal"
from = "component.seat_pilot"
to = "component.turret_dorsal"
